<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>廢校預警 ・ 全台國小學生人數推估</title>
    <meta
      name="description"
      content="以教育部統計處開放資料推估 114–130 學年度全台國民小學學生人數，標示可能面臨廢校的學校。"
    />
    <!-- style-src 'unsafe-inline' is required by Leaflet, which injects
         inline styles for tile/marker positioning at runtime. Remove if
         Leaflet ever supports a nonce-based approach. -->
    <!-- frame-ancestors is intentionally omitted: per CSP Level 2 it is
         only enforced via HTTP header, not <meta>. GitHub Pages does not
         support custom response headers. To enable clickjacking protection,
         deploy behind a CDN that supports custom headers (e.g. Cloudflare
         Pages, Netlify) and set frame-ancestors 'none' + X-Frame-Options:
         DENY there. See #221. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' https://tile.openstreetmap.org https://*.basemaps.cartocdn.com data:; connect-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none';"
    />
    <link rel="preconnect" href="https://tile.openstreetmap.org" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Preload starts the download early without blocking rendering.
         The stylesheet is activated by main.jsx after the app boots.
         See #61 for why the synchronous <link rel="stylesheet"> was removed. -->
    <link
      rel="preload"
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap"
      as="style"
    />
    <noscript>
      <!-- Fallback: load fonts synchronously when JS is disabled. -->
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap"
      />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <noscript>這個頁面需要 JavaScript 才能顯示地圖。</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
