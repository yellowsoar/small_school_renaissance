<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>\u5ee2\u6821\u9810\u8b66 \u30fb \u5168\u53f0\u570b\u5c0f\u5b78\u751f\u4eba\u6578\u63a8\u4f30</title>
    <meta
      name="description"
      content="\u4ee5\u6559\u80b2\u90e8\u7d71\u8a08\u8655\u958b\u653e\u8cc7\u6599\u63a8\u4f30 114\u2013130 \u5b78\u5e74\u5ea6\u5168\u53f0\u570b\u6c11\u5c0f\u5b78\u5b78\u751f\u4eba\u6578\uff0c\u6a19\u793a\u53ef\u80fd\u9762\u81e8\u5ee2\u6821\u7684\u5b78\u6821\u3002"
    />
    <!-- CSP Level 3 granular style directives (style-src-attr, style-src-elem)
         narrow the scope of 'unsafe-inline' to style *attributes* only.
         Leaflet injects inline style attributes (element.style.transform = ...)
         for tile/marker positioning, but does NOT inject <style> elements.
         - style-src-attr 'unsafe-inline': allows Leaflet's inline style attrs
         - style-src-elem 'self' https://fonts.googleapis.com: blocks inline
           <style> elements (main XSS vector), only allows external stylesheets
         - style-src (L2 fallback): CSP L2 browsers ignore style-src-attr/elem
           and fall back to style-src, preserving current behavior unchanged.
         When Leaflet supports nonce-based styles (leaflet/leaflet#7028),
         remove 'unsafe-inline' from both style-src and style-src-attr.
         NOTE: Vite dev mode injects <style> elements for CSS HMR. The
         transformIndexHtml plugin in vite.config.js automatically adds
         'unsafe-inline' back to style-src-elem during `vite dev` (#277). -->
    <!-- frame-ancestors is intentionally omitted: per CSP Level 2 it is
         only enforced via HTTP header, not <meta>. GitHub Pages does not
         support custom response headers. A JS-level frame-busting
         mitigation is active (frameGuard.js, #315) as a best-effort
         defense. For full protection, deploy behind a CDN that supports
         custom headers (e.g. Cloudflare Pages, Netlify) and set
         frame-ancestors 'none' + X-Frame-Options: DENY there.
         See #221. -->
    <!-- img-src: data: was removed (#254) because no code path uses data
         URI images. All markers use divIcon with inline SVG, heatmap uses
         canvas, and sparklines are inline SVG polylines. If a future
         feature needs data: URIs for images, add it back with a comment
         explaining the dependency. -->
    <!-- img-src: cartocdn removed (#346) — CARTO now requires API key
         registration. Replaced with free HOT and OpenTopoMap tile domains. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; style-src-elem 'self' https://fonts.googleapis.com; style-src-attr 'unsafe-inline'; font-src 'self' https://fonts.gstatic.com; img-src 'self' https://tile.openstreetmap.org https://*.tile.openstreetmap.fr https://*.tile.opentopomap.org; connect-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none';"
    />
    <link rel="preconnect" href="https://tile.openstreetmap.org" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Preload starts the download early without blocking rendering.
         The stylesheet is activated by main.jsx after the app boots.
         See #61 for why the synchronous <link rel="stylesheet"> was removed.
         __GOOGLE_FONTS_URL__ is replaced at build time by vite.config.js
         using the single source of truth in src/config/fonts.js (#223). -->
    <link
      rel="preload"
      href="__GOOGLE_FONTS_URL__"
      as="style"
    />
    <noscript>
      <!-- Fallback: load fonts synchronously when JS is disabled. -->
      <link
        rel="stylesheet"
        href="__GOOGLE_FONTS_URL__"
      />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <noscript>\u9019\u500b\u9801\u9762\u9700\u8981 JavaScript \u624d\u80fd\u986f\u793a\u5730\u5716\u3002</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
