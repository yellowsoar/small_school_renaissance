<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>廢校預警 ・ 全台國小學生人數推估</title>
    <meta
      name="description"
      content="以教育部統計處開放資料推估 114–130 學年度全台國民小學學生人數，標示可能面臨廢校的學校。"
    />
    <!-- style-src 'unsafe-inline' is required by Leaflet, which injects
         inline styles for tile/marker positioning at runtime. Remove if
         Leaflet ever supports a nonce-based approach. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' https://tile.openstreetmap.org data:; connect-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; frame-ancestors 'none';"
    />
    <link rel="preconnect" href="https://tile.openstreetmap.org" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <noscript>這個頁面需要 JavaScript 才能顯示地圖。</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
