name: Update CSV Integrity Hash

on:
  workflow_dispatch:
    inputs:
      mode:
        description: >-
          "update" commits the new hash; "check" only reports drift.
        required: true
        type: choice
        options:
          - update
          - check
        default: update
  schedule:
    # Every Monday at 04:00 UTC \u2014 detect upstream data changes.
    - cron: '0 4 * * 1'

permissions:
  contents: read  # workflow-level: read-only default

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.drift.outputs.changed }}
      old-hash: ${{ steps.old.outputs.hash }}
      new-hash: ${{ steps.new.outputs.hash }}
      boundary-changed: ${{ steps.boundary-drift.outputs.changed }}
      boundary-old-hash: ${{ steps.boundary-old.outputs.hash }}
      boundary-new-hash: ${{ steps.boundary-new.outputs.hash }}
    defaults:
      run:
        working-directory: web
    env:
      DATA_OWNER: ${{ vars.DATA_OWNER || 'g0v' }}
      DATA_REPO: ${{ vars.DATA_REPO || 'small_school_renaissance' }}
      DATA_BRANCH: ${{ vars.DATA_BRANCH || 'gh-pages' }}
      DATA_PATH: ${{ vars.DATA_PATH || 'docs/113-107.csv' }}
      DATA_SOURCE_URL: ${{ vars.DATA_SOURCE_URL || '' }}
      BOUNDARY_SOURCE_URL: ${{ vars.BOUNDARY_SOURCE_URL || '' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: web/.nvmrc

      - name: Install dependencies
        run: npm ci --omit=dev

      - name: Capture current committed hash
        id: old
        run: |
          HASH=$(jq -r '.sha256 // empty' data-integrity.json 2>/dev/null || echo '')
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"

      - name: Download CSV and compute hash
        run: node scripts/fetch-data.js --force --update-integrity

      - name: Capture new hash
        id: new
        run: |
          HASH=$(jq -r '.sha256' data-integrity.json)
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"

      - name: Detect drift
        id: drift
        env:
          OLD_HASH: ${{ steps.old.outputs.hash }}
          NEW_HASH: ${{ steps.new.outputs.hash }}
        run: |
          if [ "$OLD_HASH" = "$NEW_HASH" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Hash unchanged: $NEW_HASH"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Hash changed: $OLD_HASH -> $NEW_HASH"
          fi

      # --- Boundary integrity (#355) ---

      - name: Capture current committed boundary hash
        id: boundary-old
        run: |
          HASH=$(jq -r '.sha256 // empty' boundary-integrity.json 2>/dev/null || echo '')
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"

      - name: Download boundary and compute hash
        run: node scripts/fetch-boundaries.js --force --update-integrity
        env:
          BOUNDARY_SOURCE_URL: ${{ vars.BOUNDARY_SOURCE_URL || '' }}

      - name: Capture new boundary hash
        id: boundary-new
        run: |
          HASH=$(jq -r '.sha256' boundary-integrity.json)
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"

      - name: Detect boundary drift
        id: boundary-drift
        env:
          OLD_HASH: ${{ steps.boundary-old.outputs.hash }}
          NEW_HASH: ${{ steps.boundary-new.outputs.hash }}
        run: |
          if [ "$OLD_HASH" = "$NEW_HASH" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Boundary hash unchanged: $NEW_HASH"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Boundary hash changed: $OLD_HASH -> $NEW_HASH"
          fi

      - name: Upload integrity artifact
        if: steps.drift.outputs.changed == 'true' || steps.boundary-drift.outputs.changed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: data-integrity
          path: |
            web/data-integrity.json
            web/boundary-integrity.json
          retention-days: 1

  commit:
    needs: detect
    if: >-
      (needs.detect.outputs.changed == 'true' || needs.detect.outputs.boundary-changed == 'true') &&
      github.event_name == 'workflow_dispatch' &&
      inputs.mode == 'update'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Download integrity artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: data-integrity
          path: web

      - name: Commit updated hash
        env:
          OLD_HASH: ${{ needs.detect.outputs.old-hash }}
          NEW_HASH: ${{ needs.detect.outputs.new-hash }}
          BOUNDARY_OLD: ${{ needs.detect.outputs.boundary-old-hash }}
          BOUNDARY_NEW: ${{ needs.detect.outputs.boundary-new-hash }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data-integrity.json web/boundary-integrity.json
          BODY="chore: update integrity hashes"
          [ "$OLD_HASH" != "$NEW_HASH" ] && BODY="$BODY

          CSV Old: ${OLD_HASH}
          CSV New: ${NEW_HASH}"
          [ "$BOUNDARY_OLD" != "$BOUNDARY_NEW" ] && BODY="$BODY

          Boundary Old: ${BOUNDARY_OLD}
          Boundary New: ${BOUNDARY_NEW}"
          git commit -m "$BODY"
          git push

      - name: Report update result
        run: echo "::notice::Integrity hashes updated and committed."

  alert:
    needs: detect
    if: >-
      (needs.detect.outputs.changed == 'true' || needs.detect.outputs.boundary-changed == 'true') &&
      (github.event_name == 'schedule' ||
       (github.event_name == 'workflow_dispatch' && inputs.mode == 'check'))
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Redact source URL
        id: redact
        env:
          RAW_URL: >-
            ${{ vars.DATA_SOURCE_URL ||
                format('https://raw.githubusercontent.com/{0}/{1}/{2}/{3}',
                  vars.DATA_OWNER  || 'g0v',
                  vars.DATA_REPO   || 'small_school_renaissance',
                  vars.DATA_BRANCH || 'gh-pages',
                  vars.DATA_PATH   || 'docs/113-107.csv') }}
        run: |
          # Strip userinfo, query string, and fragment from the source URL
          # so that signed URLs or credential-bearing URLs are never
          # published verbatim in public GitHub issues (#299).
          REDACTED=$(python3 -c "
          import sys, urllib.parse
          try:
              u = urllib.parse.urlparse(sys.argv[1])
              host = u.hostname or ''
              port = f':{u.port}' if u.port else ''
              print(f'{u.scheme}://{host}{port}{u.path}')
          except Exception:
              print('(source URL redacted)')
          " "$RAW_URL")
          echo "url=$REDACTED" >> "$GITHUB_OUTPUT"

      - name: Open issue on upstream drift
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          OLD_HASH: ${{ needs.detect.outputs.old-hash }}
          NEW_HASH: ${{ needs.detect.outputs.new-hash }}
          BOUNDARY_OLD: ${{ needs.detect.outputs.boundary-old-hash }}
          BOUNDARY_NEW: ${{ needs.detect.outputs.boundary-new-hash }}
          DATA_SRC: ${{ steps.redact.outputs.url }}
          CSV_CHANGED: ${{ needs.detect.outputs.changed }}
          BOUNDARY_CHANGED: ${{ needs.detect.outputs.boundary-changed }}
        run: |
          # Avoid duplicate issues: check for an existing open issue.
          EXISTING=$(gh issue list --state open --search 'upstream integrity hash changed' --json number --jq '.[0].number' 2>/dev/null || echo '')
          if [ -n "$EXISTING" ]; then
            echo "::notice::Open issue #$EXISTING already exists, skipping."
            exit 0
          fi

          BODY="The scheduled integrity check detected upstream hash changes.

          "
          if [ "$CSV_CHANGED" = "true" ]; then
            BODY="${BODY}### CSV
          **Old hash:** \`${OLD_HASH}\`
          **New hash:** \`${NEW_HASH}\`
          **Source:** \`${DATA_SRC}\`

          "
          fi
          if [ "$BOUNDARY_CHANGED" = "true" ]; then
            BODY="${BODY}### Boundary GeoJSON
          **Old hash:** \`${BOUNDARY_OLD}\`
          **New hash:** \`${BOUNDARY_NEW}\`

          "
          fi
          BODY="${BODY}### Action required

          1. Review the upstream data for correctness.
          2. If the change is legitimate, run the **Update CSV Integrity Hash** workflow with mode \`update\` to commit the new hash.
          3. If the change is suspicious, investigate before updating.

          ---
          _Auto-generated by the \`update-integrity.yml\` workflow._"

          gh issue create \
            --title '\u26a0\ufe0f Upstream integrity hash changed' \
            --body "$BODY"
