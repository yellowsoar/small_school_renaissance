name: Update CSV Integrity Hash

on:
  workflow_dispatch:
    inputs:
      mode:
        description: >-
          "update" commits the new hash; "check" only reports drift.
        required: true
        type: choice
        options:
          - update
          - check
        default: update
  schedule:
    # Every Monday at 04:00 UTC — detect upstream data changes.
    - cron: '0 4 * * 1'

permissions:
  contents: write
  issues: write

jobs:
  integrity:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      DATA_OWNER: ${{ vars.DATA_OWNER || 'g0v' }}
      DATA_REPO: ${{ vars.DATA_REPO || 'small_school_renaissance' }}
      DATA_BRANCH: ${{ vars.DATA_BRANCH || 'gh-pages' }}
      DATA_PATH: ${{ vars.DATA_PATH || 'docs/113-107.csv' }}
      DATA_SOURCE_URL: ${{ vars.DATA_SOURCE_URL || '' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: web/.nvmrc

      - name: Install dependencies
        run: npm ci

      - name: Capture current committed hash
        id: old
        run: |
          HASH=$(jq -r '.sha256 // empty' data-integrity.json 2>/dev/null || echo '')
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"

      - name: Download CSV and compute hash
        run: node scripts/fetch-data.js --force --update-integrity

      - name: Capture new hash
        id: new
        run: |
          HASH=$(jq -r '.sha256' data-integrity.json)
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"

      - name: Detect drift
        id: drift
        env:
          OLD_HASH: ${{ steps.old.outputs.hash }}
          NEW_HASH: ${{ steps.new.outputs.hash }}
        run: |
          if [ "$OLD_HASH" = "$NEW_HASH" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Hash unchanged: $NEW_HASH"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Hash changed: $OLD_HASH -> $NEW_HASH"
          fi

      # --- Update mode: commit the new hash ---
      - name: Commit updated hash
        if: >
          steps.drift.outputs.changed == 'true' &&
          (github.event_name == 'workflow_dispatch' && inputs.mode == 'update')
        env:
          OLD_HASH: ${{ steps.old.outputs.hash }}
          NEW_HASH: ${{ steps.new.outputs.hash }}
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data-integrity.json
          git commit -m "chore: update CSV integrity hash

          Old: ${OLD_HASH}
          New: ${NEW_HASH}"
          git push

      - name: Report update result
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'update'
        env:
          CHANGED: ${{ steps.drift.outputs.changed }}
        run: |
          if [ "$CHANGED" = 'true' ]; then
            echo "::notice::data-integrity.json updated and committed."
          else
            echo "::notice::Hash unchanged, nothing to commit."
          fi

      # --- Check mode (schedule or manual): open issue on drift ---
      - name: Open issue on upstream drift
        if: >
          steps.drift.outputs.changed == 'true' &&
          (github.event_name == 'schedule' ||
           (github.event_name == 'workflow_dispatch' && inputs.mode == 'check'))
        env:
          GH_TOKEN: ${{ github.token }}
          OLD_HASH: ${{ steps.old.outputs.hash }}
          NEW_HASH: ${{ steps.new.outputs.hash }}
          DATA_SRC: ${{ env.DATA_SOURCE_URL || format('https://raw.githubusercontent.com/{0}/{1}/{2}/{3}', env.DATA_OWNER, env.DATA_REPO, env.DATA_BRANCH, env.DATA_PATH) }}
        working-directory: .
        run: |
          # Avoid duplicate issues: check for an existing open issue.
          EXISTING=$(gh issue list --state open --search 'upstream CSV integrity hash changed' --json number --jq '.[0].number' 2>/dev/null || echo '')
          if [ -n "$EXISTING" ]; then
            echo "::notice::Open issue #$EXISTING already exists, skipping."
            exit 0
          fi

          gh issue create \
            --title '⚠️ Upstream CSV integrity hash changed' \
            --body "The scheduled integrity check detected that the upstream CSV hash has changed.

          **Old hash:** \`${OLD_HASH}\`
          **New hash:** \`${NEW_HASH}\`
          **Source:** \`${DATA_SRC}\`

          ### Action required

          1. Review the upstream CSV for correctness.
          2. If the change is legitimate, run the **Update CSV Integrity Hash** workflow with mode \`update\` to commit the new hash.
          3. If the change is suspicious, investigate before updating.

          ---
          _Auto-generated by the \`update-integrity.yml\` workflow._"
