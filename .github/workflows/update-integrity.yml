name: Update CSV Integrity Hash

on:
  workflow_dispatch:
    inputs:
      mode:
        description: >-
          "update" commits the new hash; "check" only reports drift.
        required: true
        type: choice
        options:
          - update
          - check
        default: update
  schedule:
    # Every Monday at 04:00 UTC — detect upstream data changes.
    - cron: '0 4 * * 1'

permissions:
  contents: read  # workflow-level: read-only default

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.drift.outputs.changed }}
      old-hash: ${{ steps.old.outputs.hash }}
      new-hash: ${{ steps.new.outputs.hash }}
    defaults:
      run:
        working-directory: web
    env:
      DATA_OWNER: ${{ vars.DATA_OWNER || 'g0v' }}
      DATA_REPO: ${{ vars.DATA_REPO || 'small_school_renaissance' }}
      DATA_BRANCH: ${{ vars.DATA_BRANCH || 'gh-pages' }}
      DATA_PATH: ${{ vars.DATA_PATH || 'docs/113-107.csv' }}
      DATA_SOURCE_URL: ${{ vars.DATA_SOURCE_URL || '' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: web/.nvmrc

      - name: Install dependencies
        run: npm ci --omit=dev

      - name: Capture current committed hash
        id: old
        run: |
          HASH=$(jq -r '.sha256 // empty' data-integrity.json 2>/dev/null || echo '')
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"

      - name: Download CSV and compute hash
        run: node scripts/fetch-data.js --force --update-integrity

      - name: Capture new hash
        id: new
        run: |
          HASH=$(jq -r '.sha256' data-integrity.json)
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"

      - name: Detect drift
        id: drift
        env:
          OLD_HASH: ${{ steps.old.outputs.hash }}
          NEW_HASH: ${{ steps.new.outputs.hash }}
        run: |
          if [ "$OLD_HASH" = "$NEW_HASH" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Hash unchanged: $NEW_HASH"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Hash changed: $OLD_HASH -> $NEW_HASH"
          fi

      - name: Upload integrity artifact
        if: steps.drift.outputs.changed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: data-integrity
          path: web/data-integrity.json
          retention-days: 1

  commit:
    needs: detect
    if: >-
      needs.detect.outputs.changed == 'true' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.mode == 'update'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Download integrity artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: data-integrity
          path: web

      - name: Commit updated hash
        env:
          OLD_HASH: ${{ needs.detect.outputs.old-hash }}
          NEW_HASH: ${{ needs.detect.outputs.new-hash }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data-integrity.json
          git commit -m "chore: update CSV integrity hash

          Old: ${OLD_HASH}
          New: ${NEW_HASH}"
          git push

      - name: Report update result
        run: echo "::notice::data-integrity.json updated and committed."

  alert:
    needs: detect
    if: >-
      needs.detect.outputs.changed == 'true' &&
      (github.event_name == 'schedule' ||
       (github.event_name == 'workflow_dispatch' && inputs.mode == 'check'))
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open issue on upstream drift
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          OLD_HASH: ${{ needs.detect.outputs.old-hash }}
          NEW_HASH: ${{ needs.detect.outputs.new-hash }}
          DATA_SRC: >-
            ${{ vars.DATA_SOURCE_URL ||
                format('https://raw.githubusercontent.com/{0}/{1}/{2}/{3}',
                  vars.DATA_OWNER  || 'g0v',
                  vars.DATA_REPO   || 'small_school_renaissance',
                  vars.DATA_BRANCH || 'gh-pages',
                  vars.DATA_PATH   || 'docs/113-107.csv') }}
        run: |
          # Avoid duplicate issues: check for an existing open issue.
          EXISTING=$(gh issue list --state open --search 'upstream CSV integrity hash changed' --json number --jq '.[0].number' 2>/dev/null || echo '')
          if [ -n "$EXISTING" ]; then
            echo "::notice::Open issue #$EXISTING already exists, skipping."
            exit 0
          fi

          gh issue create \
            --title '⚠️ Upstream CSV integrity hash changed' \
            --body "The scheduled integrity check detected that the upstream CSV hash has changed.

          **Old hash:** \`${OLD_HASH}\`
          **New hash:** \`${NEW_HASH}\`
          **Source:** \`${DATA_SRC}\`

          ### Action required

          1. Review the upstream CSV for correctness.
          2. If the change is legitimate, run the **Update CSV Integrity Hash** workflow with mode \`update\` to commit the new hash.
          3. If the change is suspicious, investigate before updating.

          ---
          _Auto-generated by the \`update-integrity.yml\` workflow._"
