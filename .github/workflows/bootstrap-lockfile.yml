name: Bootstrap package-lock.json

# One-shot workflow: generates web/package-lock.json and commits it to the
# triggering branch. Run once, then this file can be removed.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: web/.nvmrc

      - name: Generate package-lock.json
        working-directory: web
        run: npm install --package-lock-only --no-audit

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json already up to date"
          else
            git commit -m "chore: add package-lock.json for reproducible builds"
            git push
          fi
