name: Bootstrap uv.lock

# One-time workflow to regenerate scripts/uv.lock so it includes
# the ruff dependency from [dependency-groups] dev.  Remove this
# file after the lockfile has been updated (#444).

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: chore/lock-ruff-dependency-444-CU-86eyut540

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Regenerate lockfile
        run: cd scripts && uv lock

      - name: Commit updated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/uv.lock
          if git diff --cached --quiet; then
            echo "::notice::uv.lock unchanged, nothing to commit."
          else
            git commit -m "chore(scripts): regenerate uv.lock to include ruff dependency

          The lockfile was missing the ruff entry declared in
          [dependency-groups] dev of pyproject.toml.  Regenerated
          via 'uv lock' so CI uses a pinned ruff version.

          Closes #444"
            git push
          fi
