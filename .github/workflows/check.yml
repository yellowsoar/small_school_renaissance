name: Check

on:
  workflow_call:
    inputs:
      with-pages-upload:
        description: Upload build output as a GitHub Pages artifact
        type: boolean
        default: false
    outputs:
      coverage-pct:
        description: Line coverage percentage (integer)
        value: ${{ jobs.check.outputs.coverage-pct }}

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      coverage-pct: ${{ steps.cov.outputs.pct }}
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: web/.nvmrc
          # v5 auto-caches when package.json declares a packageManager field.
          # Add "packageManager": "npm@<version>" to enable caching.

      - name: Install dependencies
        run: |
          if [ ! -f package-lock.json ]; then
            echo "::error::package-lock.json not found. Run 'npm install' locally and commit the lockfile."
            exit 1
          fi
          npm ci

      - name: Audit dependencies for known vulnerabilities
        run: npm audit --audit-level=moderate --omit=dev

      - run: npm run lint

      - run: npm run coverage

      - name: Extract line coverage
        id: cov
        run: |
          PCT=$(jq -r '.total.lines.pct | floor' coverage/coverage-summary.json)
          echo "pct=$PCT" >> "$GITHUB_OUTPUT"

      # Guard: require a committed integrity hash before proceeding.
      # If the hash is empty or missing, the build fails closed (#233).
      # To populate the hash, run the "Update CSV Integrity Hash"
      # workflow (update-integrity.yml) with mode=update.
      - name: Verify integrity hash exists
        run: |
          HASH=$(jq -r '.sha256 // empty' data-integrity.json 2>/dev/null || echo '')
          if [ -z "$HASH" ]; then
            echo "::error::data-integrity.json sha256 is empty \u2014 CI cannot verify CSV integrity."
            echo "::error::Run: gh workflow run update-integrity.yml -f mode=update"
            exit 1
          fi
          echo "Committed hash present ($HASH), proceeding to verification."

      # Download the upstream CSV and verify its SHA-256 hash against the
      # value in data-integrity.json (#231).  --force bypasses the
      # "already present" early-exit so CI always downloads fresh.
      # To rotate the hash, run the "Update CSV Integrity Hash" workflow.
      - name: Download and verify CSV integrity
        run: node scripts/fetch-data.js --force
        env:
          DATA_OWNER: ${{ vars.DATA_OWNER || 'g0v' }}
          DATA_REPO: ${{ vars.DATA_REPO || 'small_school_renaissance' }}
          DATA_BRANCH: ${{ vars.DATA_BRANCH || 'gh-pages' }}
          DATA_PATH: ${{ vars.DATA_PATH || 'docs/113-107.csv' }}
          DATA_SOURCE_URL: ${{ vars.DATA_SOURCE_URL || '' }}

      # Guard: check the committed boundary integrity hash (#394).
      # Two-tier strategy eliminates the tautological verification
      # (auto-bootstrap computed a hash then verified against itself,
      # always passing).  When a hash IS committed, verification is
      # strict (fail-closed on mismatch).  When the hash has not yet
      # been populated, CI warns and downloads with --skip-integrity
      # for GeoJSON structural validation only — no self-verify loop.
      # To populate the hash, run update-integrity.yml (mode=update).
      - name: Verify boundary integrity hash exists
        id: boundary-guard
        run: |
          HASH=$(jq -r '.sha256 // empty' boundary-integrity.json 2>/dev/null || echo '')
          if [ -z "$HASH" ]; then
            echo "::warning::boundary-integrity.json sha256 is empty \u2014 boundary download will skip hash verification."
            echo "::warning::Run: gh workflow run update-integrity.yml -f mode=update"
            echo "skip_integrity=true" >> "$GITHUB_OUTPUT"
          else
            echo "Committed hash present ($HASH), proceeding to strict verification."
            echo "skip_integrity=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download and verify boundary integrity
        run: |
          EXTRA_FLAGS=""
          if [ "${{ steps.boundary-guard.outputs.skip_integrity }}" = "true" ]; then
            EXTRA_FLAGS="--skip-integrity"
          fi
          node scripts/fetch-boundaries.js --force $EXTRA_FLAGS
        env:
          BOUNDARY_SOURCE_URL: ${{ vars.BOUNDARY_SOURCE_URL || '' }}

      - run: npm run build
        env:
          # Override in repo Settings > Secrets and variables > Variables
          # once this repo hosts the dataset itself.
          DATA_OWNER: ${{ vars.DATA_OWNER || 'g0v' }}
          DATA_REPO: ${{ vars.DATA_REPO || 'small_school_renaissance' }}
          DATA_BRANCH: ${{ vars.DATA_BRANCH || 'gh-pages' }}
          DATA_PATH: ${{ vars.DATA_PATH || 'docs/113-107.csv' }}
          DATA_SOURCE_URL: ${{ vars.DATA_SOURCE_URL || '' }}
          BASE_PATH: ${{ vars.BASE_PATH || '/small_school_renaissance/' }}
          BOUNDARY_SOURCE_URL: ${{ vars.BOUNDARY_SOURCE_URL || '' }}

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        if: ${{ inputs.with-pages-upload }}

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        if: ${{ inputs.with-pages-upload }}
        with:
          path: web/dist
