name: Check

on:
  workflow_call:
    inputs:
      with-pages-upload:
        description: Upload build output as a GitHub Pages artifact
        type: boolean
        default: false
    outputs:
      coverage-pct:
        description: Line coverage percentage (integer)
        value: ${{ jobs.check.outputs.coverage-pct }}

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      coverage-pct: ${{ steps.cov.outputs.pct }}
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: web/.nvmrc
          # v5 auto-caches when package.json declares a packageManager field.
          # Add "packageManager": "npm@<version>" to enable caching.

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            echo "::warning::package-lock.json not found; generating before install"
            npm install --package-lock-only --no-audit
            npm ci
          fi

      - run: npm run lint

      - run: npm run coverage

      - name: Extract line coverage
        id: cov
        run: |
          PCT=$(jq -r '.total.lines.pct | floor' coverage/coverage-summary.json)
          echo "pct=$PCT" >> "$GITHUB_OUTPUT"

      - run: npm run build
        env:
          # Override in repo Settings > Secrets and variables > Variables
          # once this repo hosts the dataset itself.
          DATA_OWNER: ${{ vars.DATA_OWNER || 'g0v' }}
          DATA_REPO: ${{ vars.DATA_REPO || 'small_school_renaissance' }}
          DATA_BRANCH: ${{ vars.DATA_BRANCH || 'gh-pages' }}
          DATA_PATH: ${{ vars.DATA_PATH || 'docs/113-107.csv' }}
          DATA_SOURCE_URL: ${{ vars.DATA_SOURCE_URL || '' }}
          BASE_PATH: ${{ vars.BASE_PATH || '/small_school_renaissance/' }}

      - uses: actions/configure-pages@v5
        if: ${{ inputs.with-pages-upload }}

      - uses: actions/upload-pages-artifact@v3
        if: ${{ inputs.with-pages-upload }}
        with:
          path: web/dist
