name: CI

# Deploy only runs on main, so without this the test suite never sees a pull
# request — which is where it is actually useful.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    uses: ./.github/workflows/check.yml

  shell-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install ShellCheck and Bats
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck bats

      - name: ShellCheck
        run: shellcheck --severity=error scripts/dump_schools_*.sh

      - name: Run Shell tests
        run: bats scripts/tests/

  upload-coverage:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Write coverage percentage
        id: write
        env:
          PCT: ${{ needs.check.outputs.coverage-pct }}
        run: |
          if [ -z "$PCT" ]; then
            echo "::warning::Coverage percentage not available; skipping artifact upload"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$PCT" > coverage-pct.txt

      - name: Upload coverage artifact
        if: steps.write.outputs.skip != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-pct
          path: coverage-pct.txt
          retention-days: 1
