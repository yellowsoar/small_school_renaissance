name: CI

# Deploy only runs on main, so without this the test suite never sees a pull
# request — which is where it is actually useful.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: web

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: web/.nvmrc
          # v5 auto-caches when a lockfile is present.

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            echo "::warning::package-lock.json not found; generating before install"
            npm install --package-lock-only --no-audit
            npm ci
          fi

      - run: npm run lint

      - run: npm test
