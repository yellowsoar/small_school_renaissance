name: Regenerate Lockfile

on:
  push:
    branches:
      - refactor/replace-leaflet-heat-316-CU-86eyut540
    paths:
      - .github/workflows/regen-lockfile.yml

jobs:
  regen:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: refactor/replace-leaflet-heat-316-CU-86eyut540
          fetch-depth: 0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: web/.nvmrc

      - name: Regenerate lockfile
        working-directory: web
        run: npm install --package-lock-only

      - name: Commit updated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/package-lock.json
          git commit -m "chore: regenerate package-lock.json for leaflet-heatmap-layer" || echo "No changes"
          git push

      - name: Self-delete workflow file
        run: |
          git rm .github/workflows/regen-lockfile.yml
          git commit -m "ci: remove one-time lockfile regeneration workflow"
          git push
