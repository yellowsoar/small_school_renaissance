name: Deploy web to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/check.yml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

# Restrict the default to read-only; each job declares exactly what it
# needs so build-time code never receives unnecessary tokens (#305).
permissions:
  contents: read

concurrency:
  group: pages
  # Never cancel a deploy in flight: a half-published Pages site is worse than
  # a queued one. Correctness checks live in ci.yml, which does cancel.
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
      pages: write      # configure-pages + upload-pages-artifact
    uses: ./.github/workflows/check.yml
    with:
      with-pages-upload: true

  deploy:
    needs: build
    permissions:
      pages: write      # deploy-pages
      id-token: write   # OIDC token for Pages deployment
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
