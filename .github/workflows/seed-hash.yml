name: Seed Integrity Hash (one-time)

on:
  push:
    branches: ['fix/integrity-bypass-233-CU-86eyut540']
    paths: ['.github/workflows/seed-hash.yml']

permissions:
  contents: write

jobs:
  seed:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      DATA_OWNER: ${{ vars.DATA_OWNER || 'g0v' }}
      DATA_REPO: ${{ vars.DATA_REPO || 'small_school_renaissance' }}
      DATA_BRANCH: ${{ vars.DATA_BRANCH || 'gh-pages' }}
      DATA_PATH: ${{ vars.DATA_PATH || 'docs/113-107.csv' }}
      DATA_SOURCE_URL: ${{ vars.DATA_SOURCE_URL || '' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: fix/integrity-bypass-233-CU-86eyut540

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: web/.nvmrc

      - name: Install dependencies
        run: npm ci

      - name: Download CSV and compute hash
        run: node scripts/fetch-data.js --force --update-integrity

      - name: Verify hash was populated
        run: |
          HASH=$(jq -r '.sha256' data-integrity.json)
          if [ -z "$HASH" ] || [ "$HASH" = "null" ]; then
            echo "::error::Failed to compute hash"
            exit 1
          fi
          echo "Computed SHA-256: $HASH"

      - name: Commit updated hash
        working-directory: .
        run: |
          HASH=$(jq -r '.sha256' web/data-integrity.json)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data-integrity.json
          git diff --cached --quiet && echo "Hash unchanged" && exit 0
          git commit -m "chore: seed CSV integrity hash\n\nSHA-256: $HASH"
          git push
